<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Audit Management</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="login" class="login"><form id="loginForm" class="card"><h1>Inventory Audit Management</h1><p>Phase 1 secure workspace</p><label>Username<input name="username" value="admin" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><div id="loginError" class="error"></div></form></div>
<div id="app" hidden><aside><div class="brand">IAM<span>Audit & Inventory Suite</span></div><nav id="nav"></nav><button class="secondary signout" onclick="location.reload()">Sign out</button></aside><main><header><div><h1 id="title">Dashboard</h1><small id="user"></small></div><button id="addBtn" hidden>+ New</button></header><section id="content"></section></main></div>
<dialog id="modal"><form id="entityForm" method="dialog"><h2 id="formTitle"></h2><div id="fields"></div><div class="actions"><button type="button" class="secondary" onclick="modal.close()">Cancel</button><button type="submit">Save</button></div></form></dialog>
<script src="/app.js"></script></body></html>
